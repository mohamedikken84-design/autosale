[build]
  publish = "dist"
  command = "npm run build"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/scrape-autoscout"
  to = "/.netlify/functions/scrape-autoscout"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
